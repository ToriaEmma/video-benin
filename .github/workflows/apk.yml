name: APK Android

# Construit l'APK dans le cloud : ni Java ni le SDK Android ne sont requis
# sur la machine de developpement.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer les dependances
        working-directory: app
        run: npm ci || npm install

      - name: Construire le site
        working-directory: app
        run: npm run build

      - name: Synchroniser Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: video-benin-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
